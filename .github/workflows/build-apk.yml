name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Release APK
      working-directory: ./android
      run: gradle assembleRelease --stacktrace

    - name: Rename APK for release
      run: |
        cp android/app/build/outputs/apk/release/app-release.apk cardex.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cardex-android-apk
        path: cardex.apk

    - name: Publish Release with APK
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.0
        name: "Автотека v1.0.0 (CarDex Launch Release)"
        body: |
          🏎️ **Автотека (CarDex) 1.0.0 — Премиальное приложение для автоспоттинга & личный гараж!**

          ### ✨ Что нового в версии 1.0.0:
          - 🖤 **Чистый Абсолютный Карбон AMOLED**: чистый `#000000`, отсутствие белых багов на кнопках и барах, синхронизация с системными цветами Android.
          - 👤 **Профиль споттера**:
            - Никнейм по умолчанию: **Ваня** (в Android APK) и **Ragazzo_15** (в веб-версии / GitHub Pages).
            - Аватар, биография/статус.
            - Привязка соцсетей: **Drive2, Telegram, YouTube, VK, личный сайт / блог**.
          - 🏎️ **Мой личный гараж**: отдельный раздел для сохранения своих машин, корчей и проектов мечты.
          - 🗺️ **Интерактивная карта автоспотов**: карта с неоновыми кастомными пинами и всплывающими карточками тачек, навигация в один клик.
          - 📸 **EXIF & GPS автоопределение**: дата съёмки и координаты автоматически считываются из оригинальных фотоснимков.
          - 🎴 **Gran Turismo Trading Card**: генерация крутых коллекционных постеров 1200x800 в формате PNG с телеметрией спота.
          - ✈️ **Telegram Share**: быстрый шеринг карточки и описания спота в Telegram.
          - 🎨 **Автомобильные темы**: Rosso Corsa, Lava Orange, WRX Blue, Racing Green, Modena Yellow, Midnight Purple и редактор 4 цветов.
          - ☕ **Поддержка разработчика**: донат через Ozon Банк / СБП.
          - 👥 **Создатели**: Ragazzo_15 / Ваня & slawastr.
        files: cardex.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
