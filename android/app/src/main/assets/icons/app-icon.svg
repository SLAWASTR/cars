<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="70%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Supercar Accent Gradient -->
    <linearGradient id="neonSpeed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>

    <!-- Tachometer Redline Gradient -->
    <linearGradient id="redline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Carbon Rim Outer Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#262626" stroke-width="3"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Tachometer Arc in Background -->
  <path d="M 120 300 A 160 160 0 1 1 392 300" fill="none" stroke="#222222" stroke-width="14" stroke-linecap="round"/>
  <path d="M 120 300 A 160 160 0 1 1 330 165" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M 330 165 A 160 160 0 0 1 392 300" fill="none" stroke="url(#redline)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Tachometer Ticks -->
  <line x1="256" y1="120" x2="256" y2="136" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="150" x2="192" y2="162" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="332" y1="150" x2="320" y2="162" stroke="url(#redline)" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="220" x2="146" y2="225" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="382" y1="220" x2="366" y2="225" stroke="url(#redline)" stroke-width="3" stroke-linecap="round"/>

  <!-- Supercar Silhouette Profile (Aero Hypercar Streamline) -->
  <g transform="translate(0, 10)">
    <!-- Aerodynamic body line -->
    <path d="M 90 320 
             C 120 318, 145 315, 175 295 
             C 205 275, 235 240, 275 238 
             C 315 236, 355 255, 385 285 
             C 405 305, 420 318, 435 320
             L 425 330
             C 395 330, 380 328, 360 328
             C 330 328, 310 338, 290 338
             L 220 338
             C 200 338, 180 328, 150 328
             C 130 328, 110 330, 80 330 Z" 
          fill="url(#neonSpeed)" filter="url(#glow)"/>

    <!-- Cockpit & Roof Canopy -->
    <path d="M 210 270 
             C 230 242, 255 238, 280 242 
             C 305 246, 325 262, 335 272 
             C 305 268, 260 268, 210 270 Z" 
          fill="#0D0D0D" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.7"/>

    <!-- Sharp LED Headlight Beam -->
    <polygon points="415,312 445,316 425,322" fill="#00F5FF" filter="url(#glow)"/>
    <line x1="420" y1="316" x2="480" y2="318" stroke="#00F5FF" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>

    <!-- Red Taillight Glow Line -->
    <line x1="80" y1="322" x2="115" y2="322" stroke="#FF3B30" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Wheels (Front & Rear Aero Discs) -->
    <!-- Front Wheel -->
    <circle cx="365" cy="330" r="28" fill="#141414" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="365" cy="330" r="16" fill="#222222" stroke="#FF3B30" stroke-width="2.5"/>
    <circle cx="365" cy="330" r="6" fill="#FFFFFF"/>

    <!-- Rear Wheel -->
    <circle cx="145" cy="330" r="28" fill="#141414" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="145" cy="330" r="16" fill="#222222" stroke="#FF3B30" stroke-width="2.5"/>
    <circle cx="145" cy="330" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Speed Needle Accent -->
  <polygon points="256,290 252,190 256,180 260,190" fill="#FF3B30" filter="url(#glow)"/>
  <circle cx="256" cy="290" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Logo Banner Plate at Bottom -->
  <g transform="translate(156, 395)">
    <rect width="200" height="42" rx="21" fill="#121212" stroke="#333333" stroke-width="1.5"/>
    <text x="100" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">CARDEX</text>
  </g>
</svg>
